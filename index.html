<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курсы Криптовалют</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Курсы Криптовалют</h1>

    <!-- Кнопки для подключения кошельков -->
    <button id="connect-phantom">Подключить Phantom</button>
    <p id="wallet-address">Адрес кошелька: не подключен</p>

    <!-- Таблица курсов -->
    <table>
        <thead>
            <tr>
                <th>Криптовалюта</th>
                <th>Цена (USD)</th>
            </tr>
        </thead>
        <tbody id="crypto-table">
            <!-- Данные будут загружаться сюда -->
        </tbody>
    </table>

    <!-- График цен криптовалют -->
    <h2>График цен криптовалют</h2>
    <canvas id="cryptoChart"></canvas>

    <!-- Подключаем Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Подключаем основной скрипт -->
    <script src="script.js"></script>
</body>

</html>
